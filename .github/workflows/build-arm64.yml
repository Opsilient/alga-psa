# Opsilient: native arm64 builds of the upstream AlgaPSA images (upstream only publishes amd64).
# Builds straight from the Nine-Minds/alga-psa commit/tag given as input; this fork's own tree
# is not used. All four packages must stay PRIVATE on GHCR (the EE licence forbids distribution).
#
# Only patch applied on top of the unchanged upstream tree: the workflow-worker Dockerfile gets
# NODE_OPTIONS=--max-old-space-size=4096 in its builder stage (tsc OOMs at node's default ~2 GB);
# upstream's Dockerfile at 016e0afc sets no heap size and takes no build arg for it. The step is
# skipped if upstream starts setting max-old-space-size itself.
name: Build arm64 images
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "upstream commit SHA or tag to build"
        required: true
        default: "016e0afc88fb784587b3ebe51fc64a2d30ffc0a9"
      images:
        description: "comma-separated subset of: alga-psa-ee,alga-workflow-worker,alga-email-service,alga-temporal-worker"
        required: true
        default: "alga-psa-ee,alga-workflow-worker,alga-email-service,alga-temporal-worker"
      diagnose:
        description: "TEMP: only print size breakdown of the existing images"
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  diagnose:
    if: inputs.diagnose
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        name: [alga-psa-ee, alga-workflow-worker, alga-email-service, alga-temporal-worker]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          img=ghcr.io/opsilient/${{ matrix.name }}:016e0afc
          docker pull -q $img
          docker image inspect -f '{{.Size}}' $img
          docker history --no-trunc --format '{{.Size}}	{{.CreatedBy}}' $img | cut -c1-220
          docker run --rm --entrypoint sh -u 0 $img -c '
            echo "== /app"; du -xs /app/* /app/.[!.]* 2>/dev/null | sort -n | tail -25
            echo "== node_modules dirs"; find / -xdev -type d -name node_modules -prune 2>/dev/null | xargs -r du -s 2>/dev/null | sort -n | tail -15
            for nm in /app/node_modules /app/ee/temporal-workflows/node_modules; do [ -d $nm ] || continue; echo "== top of $nm"; du -s $nm/* $nm/@*/* $nm/.cache 2>/dev/null | sort -n | tail -40; done
            echo "== caches"; du -s /app/server/.next/cache /app/server/.next /root/.npm /root/.cache /usr/local/lib/node_modules /tmp 2>/dev/null
            echo "== outside /app"; du -xs /usr /opt /var /root 2>/dev/null'
  plan:
    if: ${{ !inputs.diagnose }}
  plan:
    # Matrix = the known images filtered by the `images` input (a job-level `if` cannot see `matrix`).
    # build_args / target mirror the vendor's own compose/CI: NEXT_BUILD_MAX_OLD_SPACE_SIZE is the knob
    # scripts/set-image-tag.sh passes; temporal-worker is docker-compose.ee.yaml's context=., target=production.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          all='[
            {"name":"alga-psa-ee",          "file":"ee/server/Dockerfile.build",         "target":"",           "build_args":"NEXT_BUILD_MAX_OLD_SPACE_SIZE=12288"},
            {"name":"alga-workflow-worker", "file":"services/workflow-worker/Dockerfile", "target":"",           "build_args":""},
            {"name":"alga-email-service",   "file":"services/email-service/Dockerfile",   "target":"",           "build_args":""},
            {"name":"alga-temporal-worker", "file":"ee/temporal-workflows/Dockerfile",    "target":"production", "build_args":""}
          ]'
          want=$(printf '%s' "$IMAGES" | tr -d ' \n' | jq -Rsc 'split(",") | map(select(. != ""))')
          unknown=$(jq -nc --argjson w "$want" --argjson a "$all" '$w - ($a | map(.name))')
          [ "$unknown" = "[]" ] || { echo "unknown image(s): $unknown" >&2; exit 1; }
          [ "$want" != "[]" ] || { echo "images input is empty" >&2; exit 1; }
          matrix=$(jq -c --argjson w "$want" '{include: map(select(.name as $n | $w | index($n)))}' <<<"$all")
          echo "building: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Nine-Minds/alga-psa
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Free disk space (EE build needs 10+ GB intermediate)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/lib/node_modules /usr/share/swift || true
          sudo docker image prune -af >/dev/null || true
          df -h /
      - name: Tag = short SHA of the checked-out upstream commit (set-image-tag.sh convention)
        run: echo "SHORT_TAG=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
      - name: Patch workflow-worker builder heap (tsc OOMs at default 2 GB)
        if: matrix.name == 'alga-workflow-worker'
        run: |
          if grep -q 'max-old-space-size' services/workflow-worker/Dockerfile; then
            echo "upstream already sets a heap size; no patch needed"
          else
            sed -i '1a ENV NODE_OPTIONS=--max-old-space-size=4096' services/workflow-worker/Dockerfile
            head -3 services/workflow-worker/Dockerfile
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/opsilient/${{ matrix.name }}:${{ env.SHORT_TAG }}
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.ref }}
      - name: Report digest and compressed size
        run: |
          img="ghcr.io/opsilient/${{ matrix.name }}"
          digest="${{ steps.push.outputs.digest }}"
          size=$(docker buildx imagetools inspect --raw "$img@$digest" | jq '[.layers[].size] | add')
          echo "${{ matrix.name }}:${SHORT_TAG}@${digest} compressed=${size} bytes" >> "$GITHUB_STEP_SUMMARY"
